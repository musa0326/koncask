<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Futbol Okulu Yönetim Sistemi</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .tab-btn { padding: 10px; cursor: pointer; background: #ddd; border: none; }
        .tab-btn.active { background: #333; color: white; }
        .section { display: none; margin-top: 20px; }
        .section.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    </style>
</head>
<body>

<div class="container" id="app" style="display:none;">
    <h1>Futbol Takip Sistemi</h1>
    <div>
        <button class="tab-btn active" onclick="showTab('kayit')">Kayıtlar</button>
        <button class="tab-btn" onclick="showTab('antrenman')">Antrenman Çizelgesi</button>
    </div>

    <!-- Kayıt Bölümü -->
    <div id="kayit" class="section active">
        <select id="tur"><option>Bireysel</option><option>Futbol Okulu</option></select>
        <input id="ad" placeholder="Ad Soyad">
        <button onclick="kaydet()">Ekle</button>
        <table id="liste"><thead><tr><th>Tür</th><th>Ad</th><th>İşlem</th></tr></thead><tbody></tbody></table>
    </div>

    <!-- Antrenman Bölümü -->
    <div id="antrenman" class="section">
        <h3>Antrenman Çizelgesi</h3>
        <input id="tarih" type="date">
        <input id="detay" placeholder="Antrenman Notu">
        <button onclick="antrenmanEkle()">Ekle</button>
        <ul id="antrenmanListesi"></ul>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBnwQM8iQO9cn34npzJS56xMvpRl2Ni0eU",
        authDomain: "futboltakip-158af.firebaseapp.com",
        projectId: "futboltakip-158af",
        storageBucket: "futboltakip-158af.firebasestorage.app",
        messagingSenderId: "725460393559",
        appId: "1:725460393559:web:70389b09cd9cb95f0a4d12"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Şifre
    if(prompt("Şifre:") === "1234") {
        document.getElementById("app").style.display = "block";
    } else { location.reload(); }

    // Sekme Değiştirme
    window.showTab = (id) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.target.classList.add('active');
    };

    // Firebase'den Verileri Çek
    onSnapshot(collection(db, "sporcular"), (snap) => {
        let html = "";
        snap.forEach(d => html += `<tr><td>${d.data().tur}</td><td>${d.data().ad}</td><td><button onclick="sil('${d.id}')">Sil</button></td></tr>`);
        document.querySelector("#liste tbody").innerHTML = html;
    });

    window.kaydet = async () => {
        await addDoc(collection(db, "sporcular"), { tur: document.getElementById("tur").value, ad: document.getElementById("ad").value });
    };

    window.sil = async (id) => { await deleteDoc(doc(db, "sporcular", id)); };
    
    // Antrenman kısmı benzer şekilde eklenebilir...
</script>
</body>
</html>
