<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Futbol Okulu Yönetim Paneli</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; padding: 20px; color: #334155; }
        .container { max-width: 950px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: none; border-radius: 6px; background: #e2e8f0; font-weight: bold; }
        .tab-btn.active { background: #10b981; color: white; }
        .section { display: none; }
        .section.active { display: block; }
        input, select, button { padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin: 5px; }
        button { background: #10b981; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.9; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #f1f5f9; }
        .btn-delete { background: #ef4444; padding: 6px 12px; font-size: 12px; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="card" style="background: #1e293b; color: white; display: flex; justify-content: space-between; align-items: center;">
        <h2>⚽ Futbol Okulu Yönetim Paneli</h2>
        <span style="background: #10b981; padding: 5px 10px; border-radius: 5px; font-size: 13px;">Bağlı (Ortak)</span>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('kayit')">Sporcu Kayıt</button>
        <button class="tab-btn" onclick="switchTab('antrenman')">Antrenman Çizelgesi</button>
    </div>

    <!-- Sporcu Kayıt Bölümü -->
    <div id="kayit" class="section active card">
        <h3>Yeni Sporcu Ekle</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px;">
            <select id="tur"><option value="Bireysel">Bireysel</option><option value="Futbol Okulu">Futbol Okulu</option></select>
            <input type="text" id="ad" placeholder="Ad Soyad" style="width: 200px;">
            <input type="number" id="yas" placeholder="Yaş" style="width: 60px;">
            <input type="tel" id="telefon" placeholder="İletişim Numarası" style="width: 150px;">
            <button onclick="kaydet()">Sporcuyu Kaydet</button>
        </div>
        
        <table border="1">
            <thead>
                <tr>
                    <th>Tür</th>
                    <th>Ad Soyad</th>
                    <th>Yaş</th>
                    <th>İletişim</th>
                    <th>İşlem</th>
                </tr>
            </thead>
            <tbody id="liste"></tbody>
        </table>
    </div>

    <!-- Antrenman Çizelgesi Bölümü -->
    <div id="antrenman" class="section card">
        <h3>Antrenman Çizelgesi</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px;">
            <input type="date" id="tarih">
            <input type="text" id="antNot" placeholder="Antrenman Notu" style="flex: 1; min-width: 200px;">
            <button onclick="antEkle()">Antrenman Ekle</button>
        </div>
        <ul id="antListe" style="list-style-type: none; padding: 0;"></ul>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBnwQM8iQO9cn34npzJS56xMvpRl2Ni0eU",
        authDomain: "futboltakip-158af.firebaseapp.com",
        projectId: "futboltakip-158af",
        storageBucket: "futboltakip-158af.firebasestorage.app",
        messagingSenderId: "725460393559",
        appId: "1:725460393559:web:70389b09cd9cb95f0a4d12"
    };

    const db = getFirestore(initializeApp(firebaseConfig));

    window.switchTab = (id) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.target.classList.add('active');
    };

    // Sporcu Verileri
    onSnapshot(collection(db, "sporcular"), (s) => {
        let h = "";
        s.forEach(d => {
            let v = d.data();
            h += `<tr><td>${v.tur||''}</td><td>${v.ad||''}</td><td>${v.yas||''}</td><td>${v.telefon||''}</td><td><button class="btn-delete" onclick="sil('${d.id}', 'sporcular')">Sil</button></td></tr>`;
        });
        document.getElementById("liste").innerHTML = h;
    });

    window.kaydet = async () => {
        await addDoc(collection(db, "sporcular"), { 
            tur: document.getElementById("tur").value, 
            ad: document.getElementById("ad").value, 
            yas: document.getElementById("yas").value, 
            telefon: document.getElementById("telefon").value 
        });
        alert("Kayıt Başarılı!");
    };

    // Antrenman
    onSnapshot(collection(db, "antrenman"), (s) => {
        let h = "";
        s.forEach(d => {
            let v = d.data();
            h += `<li style="padding:10px; border-bottom:1px solid #eee;">📅 ${v.tarih} - ${v.not} <button class="btn-delete" onclick="sil('${d.id}', 'antrenman')">Sil</button></li>`;
        });
        document.getElementById("antListe").innerHTML = h;
    });

    window.antEkle = async () => {
        await addDoc(collection(db, "antrenman"), { tarih: document.getElementById("tarih").value, not: document.getElementById("antNot").value });
    };

    window.sil = async (id, col) => { if(confirm("Emin misiniz?")) await deleteDoc(doc(db, col, id)); };
</script>
</body>
</html>
