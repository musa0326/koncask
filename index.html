<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Futbol Takip Sistemi</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBnwQM8iQO9cn34npzJS56xMvpRl2Ni0eU",
            authDomain: "futboltakip-158af.firebaseapp.com",
            projectId: "futboltakip-158af",
            storageBucket: "futboltakip-158af.firebasestorage.app",
            messagingSenderId: "725460393559",
            appId: "1:725460393559:web:70389b09cd9cb95f0a4d12"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Şifre kontrolü
        const APP_PASSWORD = "1234";
        
        function checkPassword() {
            let pass = prompt("Lütfen şifreyi girin:");
            if (pass !== APP_PASSWORD) {
                alert("Hatalı şifre!");
                location.reload();
            } else {
                renderUI();
            }
        }

        // Verileri ekrana basma
        function renderUI() {
            document.body.innerHTML = `
                <h1>Futbolcu Takip Paneli</h1>
                <input id="ad" placeholder="Ad Soyad">
                <button onclick="ekle()">Ekle</button>
                <ul id="liste"></ul>
            `;
            
            onSnapshot(collection(db, "sporcular"), (snapshot) => {
                const liste = document.getElementById("liste");
                liste.innerHTML = "";
                snapshot.forEach((doc) => {
                    liste.innerHTML += `<li>${doc.data().ad} <button onclick="sil('${doc.id}')">Sil</button></li>`;
                });
            });
        }

        window.ekle = async () => {
            const ad = document.getElementById("ad").value;
            if(ad) await addDoc(collection(db, "sporcular"), { ad: ad });
        };

        window.sil = async (id) => {
            await deleteDoc(doc(db, "sporcular", id));
        };

        checkPassword();
    </script>
</head>
<body>
    <p>Yükleniyor...</p>
</body>
</html>
