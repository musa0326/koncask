<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Futbol Okulu Yönetim Paneli</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; padding: 20px; color: #334155; }
        .container { max-width: 950px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: none; border-radius: 6px; background: #e2e8f0; font-weight: bold; }
        .tab-btn.active { background: #10b981; color: white; }
        .section { display: none; }
        .section.active { display: block; }
        input, select, button { padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin: 5px; }
        button { background: #10b981; color: white; border: none; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #f1f5f9; }
        .btn-delete { background: #ef4444; padding: 6px 12px; font-size: 12px; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="card" style="background: #1e293b; color: white; display: flex; justify-content: space-between; align-items: center;">
        <h2>⚽ Futbol Okulu Yönetim Paneli</h2>
        <span style="background: #10b981; padding: 5px 10px; border-radius: 5px; font-size: 13px;">Bağlı (Ortak)</span>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('bireysel')">Bireysel Kayıtlar</button>
        <button class="tab-btn" onclick="switchTab('okul')">Futbol Okulu</button>
        <button class="tab-btn" onclick="switchTab('antrenman')">Antrenman</button>
    </div>

    <!-- Bireysel Kayıt -->
    <div id="bireysel" class="section active card">
        <h3>Bireysel Antrenman Kayıtları</h3>
        <input type="text" id="ad_b" placeholder="Ad Soyad">
        <input type="number" id="yas_b" placeholder="Yaş">
        <input type="tel" id="tel_b" placeholder="Telefon">
        <button onclick="kaydet('Bireysel', 'ad_b', 'yas_b', 'tel_b')">Ekle</button>
        <table><thead><tr><th>Ad</th><th>Yaş</th><th>Telefon</th><th>İşlem</th></tr></thead><tbody id="liste_b"></tbody></table>
    </div>

    <!-- Futbol Okulu Kayıt -->
    <div id="okul" class="section card">
        <h3>Futbol Okulu Kayıtları</h3>
        <input type="text" id="ad_o" placeholder="Ad Soyad">
        <input type="number" id="yas_o" placeholder="Yaş">
        <input type="tel" id="tel_o" placeholder="Telefon">
        <button onclick="kaydet('Futbol Okulu', 'ad_o', 'yas_o', 'tel_o')">Ekle</button>
        <table><thead><tr><th>Ad</th><th>Yaş</th><th>Telefon</th><th>İşlem</th></tr></thead><tbody id="liste_o"></tbody></table>
    </div>

    <!-- Antrenman Çizelgesi -->
    <div id="antrenman" class="section card">
        <h3>Antrenman Çizelgesi</h3>
        <input type="date" id="tarih">
        <input type="text" id="antNot" placeholder="Not...">
        <button onclick="antEkle()">Ekle</button>
        <ul id="antListe"></ul>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const db = getFirestore(initializeApp({
        apiKey: "AIzaSyBnwQM8iQO9cn34npzJS56xMvpRl2Ni0eU",
        authDomain: "futboltakip-158af.firebaseapp.com",
        projectId: "futboltakip-158af",
        storageBucket: "futboltakip-158af.firebasestorage.app",
        messagingSenderId: "725460393559",
        appId: "1:725460393559:web:70389b09cd9cb95f0a4d12"
    }));

    window.switchTab = (id) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.target.classList.add('active');
    };

    // Listeleme
    const listele = (tur, listeId) => {
        onSnapshot(query(collection(db, "sporcular"), where("tur", "==", tur)), (s) => {
            let h = "";
            s.forEach(d => {
                let v = d.data();
                h += `<tr><td>${v.ad}</td><td>${v.yas}</td><td>${v.telefon}</td><td><button class="btn-delete" onclick="sil('${d.id}')">Sil</button></td></tr>`;
            });
            document.getElementById(listeId).innerHTML = h;
        });
    };
    listele("Bireysel", "liste_b");
    listele("Futbol Okulu", "liste_o");

    window.kaydet = async (tur, ad, yas, tel) => {
        await addDoc(collection(db, "sporcular"), { tur, ad: document.getElementById(ad).value, yas: document.getElementById(yas).value, telefon: document.getElementById(tel).value });
        alert("Kayıt Başarılı!");
    };

    onSnapshot(collection(db, "antrenman"), (s) => {
        let h = "";
        s.forEach(d => h += `<li>${d.data().tarih} - ${d.data().not} <button class="btn-delete" onclick="sil('${d.id}', 'antrenman')">Sil</button></li>`);
        document.getElementById("antListe").innerHTML = h;
    });

    window.antEkle = async () => {
        await addDoc(collection(db, "antrenman"), { tarih: document.getElementById("tarih").value, not: document.getElementById("antNot").value });
    };

    window.sil = async (id, col = "sporcular") => { await deleteDoc(doc(db, col, id)); };
</script>
</body>
</html>
