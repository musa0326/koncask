<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Futbol Okulu Yönetim Paneli</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; padding: 20px; color: #334155; }
        .container { max-width: 950px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: none; border-radius: 6px; background: #e2e8f0; font-weight: bold; }
        .tab-btn.active { background: #10b981; color: white; }
        .section { display: none; }
        .section.active { display: block; }
        input, select, button { padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin: 5px; }
        button { background: #10b981; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.9; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #f1f5f9; }
        .btn-delete { background: #ef4444; padding: 6px 12px; font-size: 12px; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="card" style="background: #1e293b; color: white; display: flex; justify-content: space-between; align-items: center;">
        <h2>⚽ Futbol Okulu Yönetim Paneli</h2>
        <span style="background: #10b981; padding: 5px 10px; border-radius: 5px; font-size: 13px;">Bağlı (Ortak)</span>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('kayitlar')">Sporcu Kayıtları</button>
        <button class="tab-btn" onclick="switchTab('antrenman')">Antrenman Çizelgesi</button>
    </div>

    <!-- Sporcu Kayıtları Bölümü (Ayrı Tablolar) -->
    <div id="kayitlar" class="section active">
        <!-- Yeni Ekleme Kartı -->
        <div class="card">
            <h3>Yeni Sporcu Ekle</h3>
            <div style="display: flex; flex-wrap: wrap; gap: 5px;">
                <select id="tur">
                    <option value="Futbol Okulu">Futbol Okulu</option>
                    <option value="Bireysel">Bireysel</option>
                </select>
                <input type="text" id="ad" placeholder="Ad Soyad" style="width: 180px;">
                <input type="number" id="yas" placeholder="Yaş" style="width: 60px;">
                <input type="tel" id="telefon" placeholder="İletişim Numarası" style="width: 140px;">
                <button onclick="kaydet()">Sporcuyu Kaydet</button>
            </div>
        </div>

        <!-- Futbol Okulu Tablosu -->
        <div class="card">
            <h3 style="color: #1e293b;">🏫 Futbol Okulu Listesi</h3>
            <table>
                <thead>
                    <tr>
                        <th>Ad Soyad</th>
                        <th>Yaş</th>
                        <th>İletişim</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="listeFutbolOkulu">
                    <tr><td colspan="4" style="text-align: center;">Yükleniyor...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Bireysel Kayıtlar Tablosu -->
        <div class="card">
            <h3 style="color: #1e293b;">👤 Bireysel Kayıt Listesi</h3>
            <table>
                <thead>
                    <tr>
                        <th>Ad Soyad</th>
                        <th>Yaş</th>
                        <th>İletişim</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="listeBireysel">
                    <tr><td colspan="4" style="text-align: center;">Yükleniyor...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Antrenman Çizelgesi Bölümü -->
    <div id="antrenman" class="section card">
        <h3>Antrenman Çizelgesi</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px;">
            <input type="date" id="tarih">
            <input type="text" id="antNot" placeholder="Antrenman Notu" style="flex: 1; min-width: 200px;">
            <button onclick="antEkle()">Antrenman Ekle</button>
        </div>
        <ul id="antListe" style="list-style-type: none; padding: 0;">
            <li style="padding: 8px; color: #666;">Yükleniyor...</li>
        </ul>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBnwQM8iQO9cn34npzJS56xMvpRl2Ni0eU",
        authDomain: "futboltakip-158af.firebaseapp.com",
        projectId: "futboltakip-158af",
        storageBucket: "futboltakip-158af.firebasestorage.app",
        messagingSenderId: "725460393559",
        appId: "1:725460393559:web:70389b09cd9cb95f0a4d12"
    };

    const db = getFirestore(initializeApp(firebaseConfig));

    window.switchTab = (id) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.target.classList.add('active');
    };

    // Verileri Çek ve Türlerine Göre Ayrı Tablolara Ayır
    onSnapshot(collection(db, "sporcular"), (s) => {
        let futbolHtml = "";
        let bireyselHtml = "";
        
        let futbolSayisi = 0;
        let bireyselSayisi = 0;

        s.forEach(d => {
            let v = d.data();
            let satir = `<tr>
                <td>${v.ad || '-'}</td>
                <td>${v.yas || '-'}</td>
                <td>${v.telefon || '-'}</td>
                <td><button class="btn-delete" onclick="sil('${d.id}', 'sporcular')">Sil</button></td>
            </tr>`;

            if (v.tur === "Futbol Okulu") {
                futbolHtml += satir;
                futbolSayisi++;
            } else if (v.tur === "Bireysel") {
                bireyselHtml += satir;
                bireyselSayisi++;
            }
        });

        if (futbolSayisi === 0) futbolHtml = `<tr><td colspan="4" style="text-align: center; color: #666;">Futbol okulu kaydı bulunmuyor.</td></tr>`;
        if (bireyselSayisi === 0) bireyselHtml = `<tr><td colspan="4" style="text-align: center; color: #666;">Bireysel kayıt bulunmuyor.</td></tr>`;

        document.getElementById("listeFutbolOkulu").innerHTML = futbolHtml;
        document.getElementById("listeBireysel").innerHTML = bireyselHtml;
    });

    window.kaydet = async () => {
        const tur = document.getElementById("tur").value;
        const ad = document.getElementById("ad").value;
        const yas = document.getElementById("yas").value;
        const telefon = document.getElementById("telefon").value;

        if (!ad) {
            alert("Lütfen ad soyad giriniz!");
            return;
        }

        await addDoc(collection(db, "sporcular"), { tur, ad, yas, telefon });
        document.getElementById("ad").value = "";
        document.getElementById("yas").value = "";
        document.getElementById("telefon").value = "";
    };

    // Antrenman Çizelgesi
    onSnapshot(collection(db, "antrenman"), (s) => {
        let h = "";
        if (s.empty) {
            h = `<li style="padding: 8px; color: #666;">Planlanmış antrenman yok.</li>`;
        } else {
            s.forEach(d => {
                let v = d.data();
                h += `<li style="background: #f1f5f9; padding: 10px; margin-bottom: 5px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center;">
                    <span>📅 <b>${v.tarih || ''}</b> - ${v.not || ''}</span>
                    <button class="btn-delete" onclick="sil('${d.id}', 'antrenman')">Sil</button>
                </li>`;
            });
        }
        document.getElementById("antListe").innerHTML = h;
    });

    window.antEkle = async () => {
        const tarih = document.getElementById("tarih").value;
        const not = document.getElementById("antNot").value;
        if (!tarih || !not) {
            alert("Lütfen tarih ve not giriniz!");
            return;
        }
        await addDoc(collection(db, "antrenman"), { tarih, not });
        document.getElementById("tarih").value = "";
        document.getElementById("antNot").value = "";
    };

    window.sil = async (id, col) => {
        if (confirm("Silmek istediğinize emin misiniz?")) {
            await deleteDoc(doc(db, col, id));
        }
    };
</script>
</body>
</html>
